[package]
name = "audio-stack-rs"
version = "0.1.0"
description = "A self-contained Rust audio stack: a gapless/crossfading playback engine (cpal + symphonia), web-radio streaming with now-playing metadata, EBU R128 loudness normalization, a live analyser, and audio-file tag/cover metadata parsing — behind one host-agnostic facade."
authors = ["Olivier Bazin"]
license = "MIT"
edition = "2021"
repository = "https://github.com/obazin/audio-stack-rs"
readme = "README.md"
keywords = ["audio", "playback", "cpal", "symphonia", "radio"]
categories = ["multimedia::audio"]

[package.metadata.docs.rs]
# Every optional feature is documentation, not just code: build them all so
# `set_time_stretch`, `set_fir_eq`, `set_convolution`, `TrackAnalysis`,
# `set_pitch_shift`, etc. actually show up on docs.rs instead of silently
# vanishing behind the `opus`-only default build.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["opus"]
# Opus playback. Off `--no-default-features` builds decode every other format
# but skip `.opus`, and — because `opusic-sys` is what drags in the libopus
# C build — no longer need cmake or a C toolchain (see the README build
# requirements). On by default so the out-of-the-box stack plays everything.
opus = ["dep:opus", "dep:symphonia-common"]
# Time-stretch: a tempo effect (pitch preserved) in the decode-thread effect
# chain, toggled and adjusted live via `AudioEngine::set_time_stretch`. Opt-in
# because it pulls in the pre-1.0 `timestretch` engine (pinned exactly); pure
# Rust, so it does not bring back the C toolchain the `opus` split removed.
stretch = ["dep:timestretch"]
# Linear-phase FIR EQ: a mastering-style ten-band EQ in the decode-thread
# effect chain, with no inter-band phase distortion, toggled via
# `AudioEngine::set_fir_eq`. It complements — does not replace — the realtime
# biquad EQ: the callback EQ stays the zero-latency default, this is the opt-in
# high-quality mode (≈43 ms latency at 48 kHz). Pure code, no new dependency
# (it reuses the `realfft` the analyser already links), so feature-off builds
# are byte-identical.
fir-eq = []
# Convolution reverb / impulse-response effect: the host supplies an IR file
# (reverb, room/headphone correction, per-channel filtering), decoded and
# resampled to the device rate and applied in the decode-thread effect chain
# via `AudioEngine::set_convolution`. Pure code, no new dependency (it reuses
# the symphonia/rubato/realfft the stack already links), so feature-off builds
# are byte-identical.
convolution = []
# Decode-thread music analysis: estimates tempo (BPM) and musical key of each
# fully-heard local track from the samples the decode thread already sees, and
# surfaces them to the host as `EngineEvent::TrackAnalysis`. Pure code, no new
# dependency (it reuses the `realfft` the analyser already links), so
# feature-off builds are byte-identical.
analysis = []
# Pitch-shift: an owned phase-vocoder pitch shifter parameterized in cents,
# duration-preserving, in the decode-thread effect chain via
# `AudioEngine::set_pitch_shift`. Pure code, no new dependency (it reuses the
# `realfft` the analyser already links), so feature-off builds are
# byte-identical.
pitch = []

# Audible time-stretch walkthrough: synthesizes a copyright-free clip and
# steps the tempo live. `cargo run --example time_stretch --features stretch`.
[[example]]
name = "time_stretch"
required-features = ["stretch"]

# Audible convolution walkthrough: synthesizes a dry clip and a short reverb
# impulse response, then plays dry → wet.
# `cargo run --example convolution --features convolution`.
[[example]]
name = "convolution"
required-features = ["convolution"]

# Audible pitch-shift walkthrough: synthesizes a clip and steps the pitch in
# cents, duration unchanged. `cargo run --example pitch_shift --features pitch`.
[[example]]
name = "pitch_shift"
required-features = ["pitch"]

[dependencies]
# ── Output + decode + DSP ────────────────────────────────────────────────────
# Cross-platform device I/O: CoreAudio, WASAPI, ALSA. Owns the realtime
# callback — the only thread allowed to touch the output buffer.
cpal = "0.18"
# Decoding + demuxing. Non-default features are opt-in, so every container and
# codec the metadata scanner accepts is enabled explicitly here; `opt-simd`
# turns on the SSE/AVX/NEON kernels.
symphonia = { version = "0.6", features = [
    "aac",
    "adpcm",
    "aiff",
    "alac",
    "all-meta",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }
# Sample-rate conversion, bypassed entirely when the file already matches the
# device rate (the common case, and the only way to stay bit-transparent).
rubato = "5"
# The ten peaking filters of the EQ, one bank per channel.
biquad = "0.6"
# Real-input FFT for the spectrum bands — half the work of a complex FFT.
realfft = "3.5"
# Lock-free SPSC ring: decoder thread produces, realtime callback consumes.
rtrb = "0.4"
# Control-plane channel: facade commands -> engine thread.
crossbeam-channel = "0.5"
# EBU R128 loudness, for files whose tags carry no ReplayGain. Pure Rust.
ebur128 = "0.1"
# Opus. Symphonia 0.6 has no Opus decoder, so `opus.rs` wraps libopus as one.
# `opusic-sys` builds libopus from bundled source with cmake. `symphonia-common`
# is not re-exported by the `symphonia` facade but carries the OpusHead parser,
# pinned to the same version so the two cannot drift apart. Both are optional
# and pulled in only by the `opus` feature.
opus = { version = "0.4", optional = true }
symphonia-common = { version = "0.6.1", optional = true }
# The time-stretch backend: pure-Rust real-time tempo engine (Keylock keeps
# pitch). Pinned to the exact version — it is pre-1.0 and its API moves fast.
timestretch = { version = "=0.14.0", optional = true }

# ── Web radio ────────────────────────────────────────────────────────────────
# Buffers an HTTP stream into something `Read + Seek`, which is what Symphonia
# needs — so a station goes through exactly the same decode/EQ/analyser path as
# a local file. `default-features = false` keeps reqwest off native-tls (and so
# off OpenSSL on Linux).
stream-download = { version = "0.24", default-features = false, features = [
    "reqwest",
    "reqwest-rustls",
    "temp-storage",
] }
# Icecast/Shoutcast in-band track titles, stripped out of the audio stream.
icy-metadata = { version = "0.6", features = ["reqwest"] }

# ── Metadata ─────────────────────────────────────────────────────────────────
# Tag + audio-properties reading for every format the engine plays (MP3, FLAC,
# WAV, AAC/ALAC in MP4, OGG/Opus, AIFF — the `AUDIO_EXTENSIONS` list in
# `metadata.rs` is authoritative). Also serves embedded cover art.
lofty = "0.22"
# Embedded/remote cover art is handed to the host as a base64 `data:` URL.
base64 = "0.22"

# ── Cross-cutting ────────────────────────────────────────────────────────────
# Wire types (events, devices, cover art, queue/station inputs) derive serde so
# the host can forward them to its UI verbatim; provider JSON is parsed here too.
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
# `log` facade only — the host installs whatever logger it likes.
log = "0.4.29"
# Owns a small runtime for the detached network tasks (reconnect, now-playing
# pollers); the one async entry point (`play_stream`) is driven by the caller.
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }
